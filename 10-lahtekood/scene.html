<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'V';src:url(../fonts/InterDisplay-SemiBold.ttf);font-weight:600}
@font-face{font-family:'V';src:url(../fonts/InterDisplay-Regular.ttf);font-weight:400}
@font-face{font-family:'V';src:url(../fonts/InterDisplay-Bold.ttf);font-weight:700}
:root{--navy:#081E40;--deep:#041026;--mist:#C3CEE0;--amber:#F2B45E}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:#000;font-family:'V',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.L{position:absolute;inset:0;will-change:transform,opacity}
.img{background-size:cover;background-position:center}
#chaos{background-image:url(../img/chaos-9x16.jpg);filter:brightness(.62) saturate(.75)}
#kv{background-image:url(../img/kv-4x5.jpg);background-position:center}
#win{background-image:url(../img/window.jpg);background-position:center 55%}
#buf{background-image:url(../img/buffet-9x16.jpg)}
#shade{background:linear-gradient(180deg,rgba(8,30,64,.6) 0%,rgba(8,30,64,0) 34%,rgba(4,16,38,0) 58%,rgba(4,16,38,.9) 100%)}
#black{background:var(--deep)}
.word{position:absolute;left:var(--pad);right:var(--pad);font-weight:600;letter-spacing:-.03em;line-height:.95}
#rush{top:40%;font-size:calc(var(--s)*.15)}
#calmw{bottom:calc(var(--safeB) + var(--s)*.06);font-size:calc(var(--s)*.11)}
#pausew{top:calc(50% + var(--s)*.2);text-align:center;font-size:calc(var(--s)*.09);color:var(--mist)}
.notif{position:absolute;display:flex;gap:16px;align-items:center;padding:20px 26px;border-radius:24px;background:rgba(255,255,255,.14);backdrop-filter:blur(18px);font-size:calc(var(--s)*.032);white-space:nowrap;box-shadow:0 20px 40px -20px rgba(0,0,0,.6)}
.notif i{width:14px;height:14px;border-radius:50%;background:#FF6B5E;flex:none}
.bar{position:absolute;border-radius:999px;background:var(--amber);box-shadow:0 0 40px rgba(242,180,94,.75)}
#end{position:absolute;inset:0}
.head{position:absolute;left:var(--pad);right:var(--pad);top:calc(var(--safeT) + var(--s)*.11)}
.head h1{font-size:var(--headfs,calc(var(--s)*.135));line-height:.97;font-weight:600;letter-spacing:-.025em}
.head h1 span{display:block;overflow:hidden}.head h1 span b{display:block;font-weight:600}
.foot{position:absolute;left:var(--pad);right:var(--pad);bottom:var(--safeB);display:flex;justify-content:space-between;align-items:flex-end}
.price{font-size:calc(var(--s)*.03);line-height:1.35}.price b{display:block;color:var(--amber);font-size:calc(var(--s)*.058);font-weight:600}
.endl{margin-top:calc(var(--s)*.02);font-size:calc(var(--s)*.03)}
.cta{display:inline-flex;align-items:center;gap:.7em;background:#fff;color:var(--deep);font-weight:600;border-radius:999px;font-size:calc(var(--s)*.034);padding:.75em 1.15em}
.cta .p{display:inline-flex;gap:.22em}.cta .p i{width:.28em;height:.9em;border-radius:1em;background:var(--deep)}
.top{position:absolute;left:var(--pad);right:var(--pad);top:var(--safeT);display:flex;justify-content:space-between;align-items:center}
.wm{font-weight:700;letter-spacing:.16em;font-size:calc(var(--s)*.032)}
.uf{font-size:calc(var(--s)*.019);letter-spacing:.06em;text-transform:uppercase;color:var(--mist)}
#grain{opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head>
<body>
<div class="L img" id="chaos"></div>
<div id="notifs"></div>
<div class="word" id="rush"></div>
<div class="L" id="black"></div>
<div class="L img" id="kv"></div>
<div class="L img" id="win"></div>
<div class="L img" id="buf"></div>
<div class="L" id="shade"></div>
<div class="bar" id="b1"></div><div class="bar" id="b2"></div>
<div class="word" id="pausew">Paus.</div>
<div class="word" id="calmw"></div>
<div id="end">
  <div class="head"><h1><span><b id="h1a">Pane detsember</b></span><span><b id="h1b">pausile.</b></span></h1></div>
  <div class="foot" id="foot">
    <div><p class="price">Jõulukruiis + jõulubuffet<b>alates XX €</b></p><p class="endl">Jõulud algavad pardal.</p></div>
    <span class="cta"><span class="p"><i></i><i></i></span>Vali oma paus</span>
  </div>
</div>
<div class="top" id="top"><span class="wm">TALLINK</span><span class="uf">Mitteametlik kontseptsioon</span></div>
<div class="L" id="grain"></div>
<script>
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1080, H = +Q.get('h') || 1920, CUT = Q.get('cut') || 'long';
const S = Math.min(W, H), PAD = Math.round(S * .07);
const vertical = H / W > 1.5;
const SAFE_T = vertical ? Math.round(H * .1) : PAD, SAFE_B = vertical ? Math.round(H * .14) : PAD;
const R = document.documentElement.style;
R.setProperty('--w', W + 'px'); R.setProperty('--h', H + 'px'); R.setProperty('--s', S + 'px');
if (!vertical) R.setProperty('--headfs', Math.round(S * .1) + 'px');
R.setProperty('--pad', PAD + 'px'); R.setProperty('--safeT', SAFE_T + 'px'); R.setProperty('--safeB', SAFE_B + 'px');

// timeline (seconds). 'long' = 15 s, 'short' = 6 s
const T = CUT === 'short'
  ? { words: [[0, .7, 'Kingid.'], [.7, 1.4, 'Tähtajad.']], notifs: [.15, .55, .95], pause: 1.5, pauseWord: [1.75, 2.3], morph: [2.3, 3.0],
      calm: [], endIn: 3.0, total: 6 }
  : { words: [[0, .8, 'Kingid.'], [.8, 1.55, 'Tähtajad.'], [1.55, 2.25, 'Peod.'], [2.25, 2.9, 'Ummikud.'], [2.9, 3.45, 'Meeldetuletused.']], notifs: [.3, .9, 1.5, 2.1, 2.7, 3.1],
      pause: 3.6, pauseWord: [4.0, 5.0], morph: [5.0, 6.0],
      calm: [[6.4, 8.0, 'kv', 'Meri.'], [8.0, 9.5, 'win', 'Valgus.'], [9.5, 11.0, 'buf', 'Jõulubuffet.']], endIn: 11.0, total: 15 };

const NOTES = ['Koosolek 15:00 · 3 min pärast', 'Kingid ostmata (4)', 'Ummik Pärnu mnt: +25 min', '38 lugemata kirja', 'Tähtaeg täna 17:00', 'Firmapidu: vasta kutsele'];
const notifBox = document.getElementById('notifs');
T.notifs.forEach((s, i) => { const d = document.createElement('div'); d.className = 'notif'; d.innerHTML = `<i></i>${NOTES[i % NOTES.length]}`; d.dataset.s = s; d.dataset.i = i; notifBox.appendChild(d); });

const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const rnd = i => (Math.sin(i * 12.9898) * 43758.5453) % 1;

// reflection centres in KV (fraction of image width/height), measured from the image
const IMG_AR = 2000 / 2489, REF = [.4573, .5348], REF_Y = [.555, .9], REF_W = .019;
function kvRect(scale) { // cover fit + scale about centre
  const cw = Math.max(W, H * IMG_AR), ch = cw / IMG_AR;
  const w = cw * scale, h = ch * scale; return { x: (W - w) / 2, y: (H - h) / 2, w, h };
}

window.render = function (t) {
  const P = T.pause;
  // chaos
  const cz = 1.08 + .06 * prog(t, 0, P) + (t < P ? .004 * Math.sin(t * 40) : 0);
  $('chaos').style.opacity = t < P ? 1 : 0;
  $('chaos').style.transform = `scale(${cz}) translate(${t < P ? Math.sin(t * 31) * 3 : 0}px,${t < P ? Math.cos(t * 27) * 3 : 0}px)`;
  let w = ''; for (const [a, b, s] of T.words) if (t >= a && t < b) w = s;
  $('rush').textContent = t < P ? w : '';
  $('rush').style.transform = `scale(${1 + .06 * ((t * 1.7) % 1)})`;
  [...notifBox.children].forEach(d => {
    const s = +d.dataset.s, i = +d.dataset.i, k = eo(prog(t, s, s + .25));
    const x = PAD + rnd(i + 1) * (W - PAD * 2 - S * .6), y = SAFE_T + S * .06 + ((i * .17 + rnd(i + 3) * .1) % .55) * H;
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.style.opacity = t < P ? k : 0; d.style.transform = `translateY(${(1 - k) * -30}px) scale(${.92 + .08 * k})`;
  });
  // black (silence) after pause
  $('black').style.opacity = t >= P ? 1 : 0;
  // bars: appear at pause centre, then morph onto the reflections
  const bh = S * .2, bw = S * .055, gap = S * .05;
  const appear = eo(prog(t, P, P + .35));
  const m = eio(prog(t, T.morph[0], T.morph[1]));
  const kvScale = 1.0 + .07 * prog(t, T.morph[0], T.total);
  const r = kvRect(kvScale);
  [$('b1'), $('b2')].forEach((b, i) => {
    const sx = W / 2 + (i ? gap / 2 : -gap / 2 - bw), sy = H / 2 - bh / 2;
    const tx = r.x + r.w * REF[i] - (r.w * REF_W) / 2, ty = r.y + r.h * REF_Y[0], tw = r.w * REF_W, th = r.h * (REF_Y[1] - REF_Y[0]);
    const x = sx + (tx - sx) * m, y = sy + (ty - sy) * m, ww = bw + (tw - bw) * m, hh = bh * appear + (th - bh) * m;
    b.style.left = x + 'px'; b.style.top = (y + (bh - bh * appear) / 2 * (1 - m)) + 'px'; b.style.width = ww + 'px'; b.style.height = hh + 'px';
    b.style.opacity = t < P ? 0 : (1 - prog(t, T.morph[1] - .25, T.morph[1] + .35)) * (.6 + .4 * appear);
    b.style.borderRadius = (bw / 2 * (1 - m) + tw / 2 * m) + 'px';
  });
  const pw = prog(t, T.pauseWord[0], T.pauseWord[0] + .3) * (1 - prog(t, T.pauseWord[1] - .25, T.pauseWord[1]));
  $('pausew').style.opacity = pw; $('pausew').style.transform = `translateY(${(1 - eo(pw)) * 20}px)`;
  // KV fades in under the morphing bars; detail cuts crossfade
  const kvIn = prog(t, T.morph[0] + .1, T.morph[1]);
  $('kv').style.opacity = kvIn;
  $('kv').style.backgroundSize = `${r.w}px ${r.h}px`; $('kv').style.backgroundPosition = `${r.x}px ${r.y}px`;
  let wo = 0, bo = 0, cw = '', co = 0;
  for (const [a, b, id, s] of T.calm) {
    const k = prog(t, a, a + .35) * (1 - prog(t, b - .35, b));
    if (id === 'win') wo = Math.max(wo, prog(t, a - .2, a + .3) * (1 - prog(t, b - .2, b + .3)));
    if (id === 'buf') bo = Math.max(bo, prog(t, a - .2, a + .3) * (1 - prog(t, b - .2, b + .3)));
    if (k > co) { co = k; cw = s; }
  }
  $('win').style.opacity = wo; $('win').style.transform = `scale(${1.04 + .04 * prog(t, 7.8, 9.7)})`;
  $('buf').style.opacity = bo; $('buf').style.transform = `scale(${1.1 - .05 * prog(t, 9.3, 11.2)})`;
  $('calmw').textContent = cw; $('calmw').style.opacity = co; $('calmw').style.transform = `translateY(${(1 - eo(co)) * 24}px)`;
  $('shade').style.opacity = prog(t, T.morph[1], T.morph[1] + .6);
  // end card
  const e1 = eo(prog(t, T.endIn + .1, T.endIn + .9)), e2 = eo(prog(t, T.endIn + .25, T.endIn + 1.05)), e3 = eo(prog(t, T.endIn + .8, T.endIn + 1.6));
  $('h1a').style.transform = `translateY(${(1 - e1) * 105}%)`; $('h1b').style.transform = `translateY(${(1 - e2) * 105}%)`;
  $('end').style.opacity = t >= T.endIn ? 1 : 0;
  $('foot').style.opacity = e3; $('foot').style.transform = `translateY(${(1 - e3) * 30}px)`;
  $('top').style.opacity = 1; // unofficial label always visible
};
render(0);
</script>
</body></html>
